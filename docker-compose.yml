services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data persistiert die Zertifikate + den ACME-Account ueber Neustarts hinweg
      # (sonst werden bei jedem Start neue Zertifikate angefragt -> Let's-Encrypt-Limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  kosit:
    build: ./kosit
    restart: unless-stopped
    # KoSIT-Validator-Sidecar. Nur intern erreichbar; die app spricht ihn
    # ueber das Compose-Netz unter http://kosit:8080 an.
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Speichert NUR gehashte API-Keys + Nutzungs-Metadaten (Zero-Retention),
    # niemals Rechnungsinhalte.
    environment:
      POSTGRES_USER: einvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: einvoice
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einvoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly + Volume: Credit-Zaehler ueberleben Neustarts (sonst bekaemen
    # Kund:innen ihre verbrauchten Credits bei jedem Redis-Neustart zurueck).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    # KEIN "ports:" - die App ist nur intern ueber das Compose-Netz erreichbar.
    # Nur Caddy ist oeffentlich; es proxyt intern an app:8000.
    expose:
      - "8000"
    environment:
      KOSIT_URL: "http://kosit:8080"
      DATABASE_URL: "postgresql://einvoice:${POSTGRES_PASSWORD:-changeme}@postgres:5432/einvoice"
      REDIS_URL: "redis://redis:6379/0"
      # Verkaufte Keys (max. 100) + Credits/Key. Mit API_KEYS != "" ist die API abgesichert.
      API_KEYS: "${API_KEYS:-}"
      CREDITS_PER_KEY: "${CREDITS_PER_KEY:-120}"
      # Oeffentliche Test-Seite /playground: strengeres Limit pro Client-IP (ohne API-Key).
      PLAYGROUND_RATE_PER_MIN: "${PLAYGROUND_RATE_PER_MIN:-30}"
    depends_on:
      kosit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
